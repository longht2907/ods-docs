name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cai dependency
        run: npm ci

      - name: Check Env
        run: npm run check:env

      - name: Check Links
        run: npm run check:links

      - name: Check Scope
        run: npm run check:scope

      - name: Typecheck
        run: npm run typecheck

      - name: Guard
        run: npm run guard

      - name: Build
        run: npm run build

      - name: Test Routes
        run: npm run test:routes
