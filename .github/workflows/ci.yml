name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ODS_DOCS_SITE_URL: https://ods-docs-ci.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cai dependency
        run: npm ci

      - name: Check Env
        run: npm run check:env

      - name: Check Links
        run: npm run check:links

      - name: Check Scope
        run: npm run check:scope

      - name: Typecheck
        run: npm run types:check

      - name: Guard
        run: npm run guard

      - name: Build
        run: npm run build
        env:
          # Build-only origin: validates absolute social metadata without representing production.
          ODS_DOCS_SITE_URL: https://ods-docs-ci.invalid

      - name: Test Routes
        run: npm run test:routes

      - name: Test Internal Content and Media
        run: npm run test:internal-content

      - name: Test Flowchart UI
        run: npm run test:flowchart
