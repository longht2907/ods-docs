services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount thư mục public/media vào container để cập nhật tức thì khi git pull
      - ./public/media:/app/public/media:ro
    environment:
      NODE_ENV: production
